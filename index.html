    /* =======================================================================
       2. NATIVE WEB AUDIO API 8-BIT SYNTHESIZER (ZERO EXTERNAL MP3s)
       ======================================================================= */
    class ArcadeSynth {
      constructor() {
        this.ctx = null;
        this.muted = true; // Default MUTED
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playBlip(force = false) {
        if (this.muted && !force) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.075);

        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.085);
      }

      playCoin(force = false) {
        if (this.muted && !force) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(987.77, now); // B5
        osc.frequency.setValueAtTime(1318.51, now + 0.08); // E6

        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.36);
      }

      playLaser(force = false) {
        if (this.muted && !force) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(150, now + 0.14);

        gain.gain.setValueAtTime(0.09, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.145);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.15);
      }

      playFanfare(force = false) {
        if (this.muted && !force) return;
        this.init();
        if (!this.ctx) return;

        const notes = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5];
        const step = 0.09;
        const now = this.ctx.currentTime;

        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const start = now + idx * step;
          osc.type = 'square';
          osc.frequency.setValueAtTime(freq, start);

          gain.gain.setValueAtTime(0.1, start);
          gain.gain.exponentialRampToValueAtTime(0.001, start + step * 1.4);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(start);
          osc.stop(start + step * 1.45);
        });
      }
    }

    function Icon({ name, className = 'w-4 h-4' }) {

    /* =======================================================================
       4. CHARACTER-SCRAMBLE / DECODE TEXT COMPONENT
       ======================================================================= */
    function ScrambleText({ text, className = '' }) {
      const [display, setDisplay] = useState(text);
      const timerRef = useRef(null);

      const triggerScramble = () => {
        const glyphs = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*';
        let iteration = 0;
        clearInterval(timerRef.current);

        timerRef.current = setInterval(() => {
          setDisplay(
            text
              .split('')
              .map((char, idx) => {
                if (char === ' ' || char === ':' || char === '/') return char;
                if (idx < iteration) return text[idx];
                return glyphs[Math.floor(Math.random() * glyphs.length)];
              })
              .join('')
          );
          if (iteration >= text.length) clearInterval(timerRef.current);
          iteration += 0.5;
        }, 22);
      };

      useEffect(() => () => clearInterval(timerRef.current), []);

      return (
        <span onMouseEnter={triggerScramble} className={className}>
          {display}
        </span>
      );
    }

    /* =======================================================================
       5. 3D SYNTHWAVE PERSPECTIVE GRID CANVAS (60 FPS + REDUCED MOTION)
       ======================================================================= */
    function SynthwaveBackground({ godMode }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
        let animId;
        let offset = 0;

        const resize = () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        };
        resize();
        window.addEventListener('resize', resize);

        const render = () => {
          const w = canvas.width;
          const h = canvas.height;
          const gridColor = godMode ? 'rgba(255, 215, 0, 0.28)' : 'rgba(0, 245, 255, 0.24)';
          const horizonGlow = godMode ? 'rgba(255, 170, 0, 0.24)' : 'rgba(255, 0, 127, 0.24)';

          ctx.fillStyle = '#070714';
          ctx.fillRect(0, 0, w, h);

          const horizonY = h * 0.42;

          const grad = ctx.createLinearGradient(0, horizonY - 90, 0, horizonY + 120);
          grad.addColorStop(0, 'transparent');
          grad.addColorStop(0.5, horizonGlow);
          grad.addColorStop(1, 'transparent');
          ctx.fillStyle = grad;
          ctx.fillRect(0, horizonY - 90, w, 210);

          ctx.strokeStyle = godMode ? '#ffd700' : '#ff007f';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(0, horizonY);
          ctx.lineTo(w, horizonY);
          ctx.stroke();

          ctx.strokeStyle = gridColor;
          ctx.lineWidth = 1;
          const centerX = w / 2;
          for (let i = -24; i <= 24; i++) {
            ctx.beginPath();
            ctx.moveTo(centerX + i * (w / 26), horizonY);
            ctx.lineTo(centerX + i * (w / 6.5), h);
            ctx.stroke();
          }

          const speed = reducedMotion.matches ? 0.15 : 1.35;
          offset = (offset + speed) % 60;

          for (let z = 1; z <= 18; z++) {
            const progress = (z * 60 + offset) / (18 * 60);
            const y = horizonY + Math.pow(progress, 2.2) * (h - horizonY);
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(w, y);
            ctx.stroke();
          }

          animId = requestAnimationFrame(render);
        };

        animId = requestAnimationFrame(render);
        return () => {
          cancelAnimationFrame(animId);
          window.removeEventListener('resize', resize);
        };
      }, [godMode]);

      return (
        <canvas
          ref={canvasRef}
          className="fixed inset-0 w-full h-full pointer-events-none z-0"
          aria-hidden="true"
        />
      );
    }

    /* =======================================================================
       6. MULTI-MODE CUSTOM ARCADE CURSOR WITH TRAIL & CLICK SHOCKWAVES
       ======================================================================= */
    function CustomArcadeCursor({ mode }) {
      const [pos, setPos] = useState({ x: -100, y: -100 });
      const [hovering, setHovering] = useState(false);
      const [trails, setTrails] = useState([]);
      const [rings, setRings] = useState([]);
      const idCounter = useRef(0);
      const lastTrailTime = useRef(0);

      useEffect(() => {
        document.body.classList.toggle('custom-cursor-active', mode !== 'SYSTEM');
        if (mode === 'SYSTEM') return;

        const onMove = (e) => {
          setPos({ x: e.clientX, y: e.clientY });
          setHovering(Boolean(e.target.closest('a, button, input, textarea, [data-interactive]')));

          const now = performance.now();
          if (now - lastTrailTime.current > 35) {
            lastTrailTime.current = now;
            const id = `trail-${++idCounter.current}`;
            const color = idCounter.current % 2 === 0 ? 'var(--primary)' : 'var(--secondary)';
            setTrails((prev) => [...prev.slice(-14), { id, x: e.clientX, y: e.clientY, color }]);
            setTimeout(() => {
              setTrails((prev) => prev.filter((t) => t.id !== id));
            }, 340);
          }
        };

        const onDown = (e) => {
          const id = `ring-${++idCounter.current}`;
          setRings((prev) => [...prev.slice(-6), { id, x: e.clientX, y: e.clientY }]);
          setTimeout(() => {
            setRings((prev) => prev.filter((r) => r.id !== id));
          }, 500);
        };

        window.addEventListener('mousemove', onMove);
        window.addEventListener('mousedown', onDown);
        return () => {
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('mousedown', onDown);
        };
      }, [mode]);

      if (mode === 'SYSTEM') return null;

      return (
        <div className="fixed inset-0 pointer-events-none z-[60] hidden md:block">
          {/* Trailing Neon Sparkles */}
          {trails.map((t) => (
            <div
              key={t.id}
              className="fixed w-1.5 h-1.5 -translate-x-1/2 -translate-y-1/2 rounded-xs opacity-75 transition-opacity duration-300"
              style={{ left: t.x, top: t.y, backgroundColor: t.color }}
            />
          ))}

          {/* Click Shockwave Rings */}
          {rings.map((r) => (
            <div
              key={r.id}
              className="fixed w-8 h-8 rounded-full border-2 click-shockwave"
              style={{ left: r.x, top: r.y, borderColor: 'var(--primary)' }}
            />
          ))}

          {/* Main Cursor Reticle */}
          <div

    /* =======================================================================
       7. PLAYABLE 2D CANVAS MINI-GAME ("BUG BLASTER")
       ======================================================================= */
    function BugBlasterGame() {
      const canvasRef = useRef(null);
      const [score, setScore] = useState(0);
      const [bugsLeft, setBugsLeft] = useState(12);
      const [victory, setVictory] = useState(false);

      const gameState = useRef({
        player: { x: 378, y: 374, w: 44, h: 24, speed: 6 },
        keys: { left: false, right: false },
        bullets: [],
        bugs: [],
        bugDir: 1,
        score: 0,
        won: false,
        lastShot: 0,
      });

      const resetGame = useCallback(() => {
        const s = gameState.current;
        s.player.x = 378;
        s.bullets = [];
        s.score = 0;
        s.won = false;
        s.bugDir = 1;
        s.bugs = [];

        const cols = 6;
        const rows = 2;
        const spacingX = 105;
        const startX = (800 - (cols - 1) * spacingX) / 2 - 18;
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            s.bugs.push({
              x: startX + c * spacingX,
              y: 44 + r * 54,
              w: 36,
              h: 26,
              alive: true,
              color: r === 0 ? '#ff007f' : '#39ff14',
            });
          }
        }
        setScore(0);
        setBugsLeft(12);
        setVictory(false);
      }, []);

      const fireLaser = useCallback(() => {
        const s = gameState.current;
        if (s.won) return;
        const now = performance.now();
        if (now - s.lastShot < 210) return;
        s.lastShot = now;
        s.bullets.push({
          x: s.player.x + s.player.w / 2 - 3,
          y: s.player.y - 10,
          w: 6,
          h: 16,
          speed: 9,
        });
        synth.playLaser();
      }, []);

      useEffect(() => {
        resetGame();
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        let animId;

        const onKeyDown = (e) => {
          const tag = document.activeElement?.tagName;
          if (tag === 'INPUT' || tag === 'TEXTAREA') return;

          if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') gameState.current.keys.left = true;
          if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') gameState.current.keys.right = true;
          if (e.code === 'Space') {
            const rect = canvas.getBoundingClientRect();
            if (rect.top < window.innerHeight && rect.bottom > 0) {
              e.preventDefault();
              fireLaser();
            }
          }
        };

        const onKeyUp = (e) => {
          if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') gameState.current.keys.left = false;
          if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') gameState.current.keys.right = false;
        };

        window.addEventListener('keydown', onKeyDown);
        window.addEventListener('keyup', onKeyUp);

        const loop = () => {
          const s = gameState.current;
          ctx.clearRect(0, 0, 800, 420);

          // Starfield
          ctx.fillStyle = 'rgba(255,255,255,0.22)';
          for (let i = 0; i < 24; i++) {
            ctx.fillRect((i * 97) % 800, (i * 53) % 420, 2, 2);
          }

          if (!s.won) {
            if (s.keys.left) s.player.x = Math.max(14, s.player.x - s.player.speed);
            if (s.keys.right) s.player.x = Math.min(800 - s.player.w - 14, s.player.x + s.player.speed);

            let hitEdge = false;
            s.bugs.forEach((b) => {
              if (!b.alive) return;
              b.x += s.bugDir * 1.4;
              if (b.x <= 16 || b.x + b.w >= 784) hitEdge = true;
            });
            if (hitEdge) s.bugDir *= -1;

            s.bullets.forEach((b) => {
              b.y -= b.speed;
              s.bugs.forEach((bug) => {
                if (!bug.alive) return;
                if (
                  b.x < bug.x + bug.w &&
                  b.x + b.w > bug.x &&
                  b.y < bug.y + bug.h &&
                  b.y + b.h > bug.y
                ) {
                  bug.alive = false;
                  b.y = -100;
                  s.score += 100;
                  synth.playBlip();
                  setScore(s.score);
                  const remaining = s.bugs.filter((item) => item.alive).length;
                  setBugsLeft(remaining);
                  if (remaining === 0) {
                    s.won = true;
                    setVictory(true);
                    synth.playFanfare();
                  }
                }
              });
            });
            s.bullets = s.bullets.filter((b) => b.y > -20);
          }

          // Draw Pixel Bugs
          s.bugs.forEach((bug) => {
            if (!bug.alive) return;
            ctx.fillStyle = bug.color;
            ctx.fillRect(bug.x + 6, bug.y, 4, 5);
            ctx.fillRect(bug.x + bug.w - 10, bug.y, 4, 5);
            ctx.fillRect(bug.x + 4, bug.y + 5, bug.w - 8, bug.h - 10);
            ctx.fillRect(bug.x, bug.y + 9, 4, 8);
            ctx.fillRect(bug.x + bug.w - 4, bug.y + 9, 4, 8);
            ctx.fillStyle = '#070714';
            ctx.fillRect(bug.x + 10, bug.y + 10, 5, 5);
            ctx.fillRect(bug.x + bug.w - 15, bug.y + 10, 5, 5);
          });

          // Draw Lasers
          ctx.fillStyle = '#ffe600';
          s.bullets.forEach((b) => ctx.fillRect(b.x, b.y, b.w, b.h));

          // Draw Debugger Ship
          const isGod = document.body.classList.contains('god-mode');
          ctx.fillStyle = isGod ? '#ffd700' : '#00f5ff';
          ctx.fillRect(s.player.x + s.player.w / 2 - 4, s.player.y - 6, 8, 10);
          ctx.fillRect(s.player.x + 6, s.player.y + 4, s.player.w - 12, s.player.h - 8);
          ctx.fillRect(s.player.x, s.player.y + 10, s.player.w, s.player.h - 10);
          ctx.fillStyle = '#ff007f';
          ctx.fillRect(s.player.x + s.player.w / 2 - 5, s.player.y + 8, 10, 6);

          animId = requestAnimationFrame(loop);
        };

        animId = requestAnimationFrame(loop);
        return () => {
          cancelAnimationFrame(animId);
          window.removeEventListener('keydown', onKeyDown);
          window.removeEventListener('keyup', onKeyUp);
        };
      }, [fireLaser, resetGame]);

      return (
        <section id="break-room" className="max-w-5xl mx-auto px-4 sm:px-6 py-20 border-t border-slate-800/70">
          <div className="text-center mb-8">
            <span className="font-vt text-xl text-yellowNeon tracking-widest">// INSERT TIME TO DE-STRESS</span>
            <h2 className="font-pixel text-lg sm:text-2xl md:text-3xl text-white mt-2">
              🕹️ THE BREAK ROOM // BUG BLASTER
            </h2>
            <p className="text-slate-300 mt-2 max-w-xl mx-auto text-sm sm:text-base">
              Squash all 12 production bugs! Use <kbd className="px-2 py-0.5 bg-cabinet border border-slate-700 rounded text-cyanNeon font-mono text-xs">←</kbd>{' '}
              <kbd className="px-2 py-0.5 bg-cabinet border border-slate-700 rounded text-cyanNeon font-mono text-xs">→</kbd> or{' '}
              <kbd className="px-2 py-0.5 bg-cabinet border border-slate-700 rounded text-cyanNeon font-mono text-xs">A</kbd>{' '}
              <kbd className="px-2 py-0.5 bg-cabinet border border-slate-700 rounded text-cyanNeon font-mono text-xs">D</kbd> to steer and{' '}
              <kbd className="px-2 py-0.5 bg-cabinet border border-slate-700 rounded text-magentaNeon font-mono text-xs">SPACE</kbd> to fire.
            </p>
          </div>

          <div className="bg-cabinet/95 border-2 neon-border-secondary rounded-2xl p-4 sm:p-6 shadow-2xl">
            <div className="flex flex-wrap items-center justify-between gap-3 pb-4 mb-4 border-b border-slate-800 font-pixel text-xs sm:text-sm">
              <div className="text-cyanNeon">
                SCORE: <span className="text-white">{String(score).padStart(4, '0')}</span>
              </div>
              <div className="text-yellowNeon">BUGS LEFT: {bugsLeft}/12</div>
              <button
                type="button"
                onClick={() => {
                  synth.playCoin();
                  resetGame();
                }}
                className="px-3 py-1.5 rounded bg-void border border-slate-700 hover:border-cyanNeon font-vt text-lg text-slate-200 transition-colors"
              >
                ↻ RESET CABINET
              </button>
            </div>

            <div className="relative rounded-xl overflow-hidden border-2 border-slate-800 bg-[#050510]">
              <canvas ref={canvasRef} width={800} height={420} className="w-full h-auto block mx-auto" />

              {victory && (
                <div className="absolute inset-0 bg-void/90 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center space-y-4">
                  <div className="px-3 py-1 rounded bg-greenNeon/20 border border-greenNeon font-vt text-xl text-greenNeon">
                    STAGE CLEARED // +1200 XP
                  </div>
                  <h3 className="font-pixel text-lg sm:text-2xl text-yellowNeon leading-relaxed">
                    VICTORY: ALL BUGS SQUASHED
                  </h3>
                  <p className="font-vt text-2xl text-white">
                    FINAL SCORE: <span className="text-cyanNeon">{score}</span> PTS
                  </p>
                  <button
                    type="button"
                    onClick={() => {
                      synth.playCoin();
                      resetGame();
                    }}
                    className="arcade-btn-primary px-6 py-3 rounded font-pixel text-xs sm:text-sm"
                  >
                    PLAY AGAIN
                  </button>
                </div>
              )}
            </div>

            {/* Touch / Mouse Controls */}
            <div className="mt-5 flex items-center justify-between gap-4 select-none">
              <div className="flex items-center gap-3">
                <button
                  type="button"
                  onPointerDown={() => (gameState.current.keys.left = true)}
                  onPointerUp={() => (gameState.current.keys.left = false)}
                  onPointerLeave={() => (gameState.current.keys.left = false)}
                  className="w-14 h-14 sm:w-16 sm:h-16 rounded-xl bg-void border-2 border-cyanNeon/70 active:bg-cyanNeon active:text-void font-pixel text-lg text-cyanNeon flex items-center justify-center"
                >
                  ◀
                </button>
                <button
                  type="button"
                  onPointerDown={() => (gameState.current.keys.right = true)}
                  onPointerUp={() => (gameState.current.keys.right = false)}
                  onPointerLeave={() => (gameState.current.keys.right = false)}
                  className="w-14 h-14 sm:w-16 sm:h-16 rounded-xl bg-void border-2 border-cyanNeon/70 active:bg-cyanNeon active:text-void font-pixel text-lg text-cyanNeon flex items-center justify-center"
                >
                  ▶
                </button>
              </div>

              <button
                type="button"
                onPointerDown={fireLaser}
                className="arcade-btn-secondary px-6 sm:px-8 h-14 sm:h-16 rounded-xl font-pixel text-xs sm:text-sm tracking-wider"
              >
                FIRE 🔥
              </button>
            </div>
          </div>
        </section>
      );
    }

                    onClick={() => setBlueprintModalStage(null)}

                    [X]

                <div className="inline-block px-3 py-1 rounded bg-goldNeon/20 border border-goldNeon font-pixel text-xs text-goldNeon">

                <div className="p-4 rounded-xl bg-void border border-goldNeon/50 font-vt text-xl text-goldNeon">

                  className="w-full py-4 rounded bg-goldNeon text-void font-pixel text-xs sm:text-sm tracking-wider shadow-[0_4px_0_#b39700] active:translate-y-1"

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ArcadePortfolioApp />);
  </script>
</body>
